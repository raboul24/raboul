<title>Calendar Journal</title>
<link rel="stylesheet" href="styles.css">

<header class="topbar">
  <a class="brand" href="#/tab/index" id="brand">Journal</a>
  <div class="topbar-actions">
    <button class="btn" id="backBtn" hidden>Back</button>
    <a class="btn" id="todayBtn" href="#/day/today">Today</a>
    <button class="btn" id="settingsBtn" aria-expanded="false" aria-controls="settings">⚙ Customize</button>
  </div>
</header>

<main class="book">
  <div class="sections" id="sections"></div>
  <article class="page" id="page"></article>
  <nav class="tabs" id="tabs" aria-label="Journal tabs"></nav>
</main>

<aside class="settings" id="settings" hidden aria-label="Customize journal"></aside>

<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="covers.js"></script>
<script src="pdf.js"></script>
<script src="app.js"></script>
