# Only this computer can reach the server (your journal has no password).
# To use it from an iPad on your Wi-Fi, start with --server.address=0.0.0.0 (see README).
server.address=127.0.0.1
server.port=8080

# Where the journal and its backups are saved (relative to the folder you start the server from: backend/).
journal.data-dir=data

# Folder that holds index.html, app.js, ... (the repo root, one level up from backend/).
journal.web-root=..

spring.main.banner-mode=off
